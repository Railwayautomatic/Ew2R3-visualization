<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ew2R3.org · робочий аватар, варіант A (затверджено 2026-07-31)
       Кольори — точно з solar.html:
       фон #05070d · E #ffd489 (Сонце) · символи #e8eefc · оператори #7f8ba3 · підпис #8ea0bd
       Зелений рядок прибрано за рішенням власника. -->
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#ffbe5a" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#ffaa3c" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffaa3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="eGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#05070d"/>
  <circle cx="256" cy="232" r="235" fill="url(#sunGlow)"/>

  <!-- точкова сітка — стилеутворюючий елемент RWA -->
  <g fill="#8ea0bd" opacity="0.13">
    <circle cx="44" cy="44" r="3"/><circle cx="96" cy="44" r="3"/><circle cx="44" cy="96" r="3"/>
    <circle cx="468" cy="468" r="3"/><circle cx="416" cy="468" r="3"/><circle cx="468" cy="416" r="3"/>
  </g>

  <g font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" text-anchor="middle">
    <!-- формула збільшена: звільнилось місце після зеленого рядка -->
    <text x="256" y="285" font-size="128" font-weight="700">
      <tspan fill="#ffd489" filter="url(#eGlow)">E</tspan><tspan fill="#7f8ba3">=</tspan><tspan fill="#e8eefc">ω</tspan><tspan fill="#e8eefc" font-size="80" dy="-39">2</tspan><tspan fill="#e8eefc" font-size="128" dy="39">R</tspan><tspan fill="#e8eefc" font-size="80" dy="-39">3</tspan>
    </text>
    <text x="256" y="382" font-size="36" fill="#8ea0bd" letter-spacing="2.5">Ew2R3.org</text>
  </g>
</svg>
